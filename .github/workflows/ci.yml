name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [default, nightly]
    runs-on: ${{ matrix.os }}
    # Nightly is an early warning for the next Mojo release; it does not block merges.
    continue-on-error: ${{ matrix.env == 'nightly' }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: ${{ matrix.env }}
      - run: pixi run -e ${{ matrix.env }} test
      - run: pixi run -e ${{ matrix.env }} build
