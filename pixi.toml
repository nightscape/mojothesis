[workspace]
authors = ["Martin Mauch <martin@mauch.dev>"]
channels = ['https://conda.modular.com/max-nightly', 'conda-forge']
name = "mojo-pbt"
platforms = ['osx-arm64']
version = "0.1.0"

[dependencies]
mojo = ">=1.3.0.dev2026112017,<2"

[tasks]
build = "mkdir -p build && mojo precompile mojo_pbt -o build/mojo_pbt.mojoc"
test = "mojo run -DASSERT=all -I . tests/test_shrinking.mojo && mojo run -DASSERT=all -I . tests/test_contracts.mojo"
