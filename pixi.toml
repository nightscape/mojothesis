[workspace]
authors = ["Martin Mauch <martin@mauch.dev>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "mojothesis"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"
preview = ["pixi-build"]

[package]
name = "mojothesis"
version = "0.1.0"
license = "Apache-2.0 WITH LLVM-exception"
license-file = "LICENSE"

[package.build]
backend = { name = "pixi-build-mojo", version = ">=0.2.6,<0.3" }

[package.host-dependencies]
mojo-compiler = ">=1.2.0,<1.3.0"

[dependencies]
mojo = ">=1.2.0,<1.3.0"

[feature.nightly]
channels = [{ channel = "https://conda.modular.com/max-nightly", priority = 1 }]

[feature.nightly.dependencies]
mojo = ">=1.3.0.dev0"

[environments]
nightly = ["nightly"]

[tasks]
build = "mkdir -p build && mojo precompile mojothesis -o build/mojothesis.mojoc"
test = "mojo run -DASSERT=all -I . tests/test_shrinking.mojo && mojo run -DASSERT=all -I . tests/test_contracts.mojo && mojo run -DASSERT=all -I . tests/test_stateful.mojo"
